site_name: NWQLib
site_description: >-
  Qiskit-based end-to-end quantum algorithm workflows for scientific
  applications
site_url: ""
repo_url: https://github.com/pnnl/NWQLib
repo_name: pnnl/NWQLib
docs_dir: docs
site_dir: site
exclude_docs: |
  scripts/
  ENVIRONMENT_LOCK.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic}}
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [dollar]
      block_syntax: [dollar]

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            allow_inspection: false
            force_inspection: false
            filters: ["!^_"]
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            summary: false

nav:
  - Home: index.md
  - Getting Started:
      - Python Quickstart: quickstart.md
      - Examples: examples.md
      - Why NWQLib: why_nwqlib.md
      - Command Line: cli.md
  - User Guides:
