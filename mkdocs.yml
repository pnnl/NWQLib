      - Supply Inputs: inputs.md
      - Estimate Resources: resources.md
      - Fault-tolerant Resources: fault-tolerant-resources.md
      - Assess Device Profiles: profiles.md
      - Search Supplied Choices: search.md
      - Execute a Plan: prepared_execution.md
      - Save and Continue a Run: run_archives.md
      - Save and Reanalyze Results: saved_evidence.md
      - Verify a Result: verification.md
  - Algorithm Guides:
      - Finite Pauli Expectation: algorithms/expectation.md
      - Chebyshev Lanczos: algorithms/lanczos.md
      - LCHS: algorithms/lchs.md
      - QPE: algorithms/qpe.md
      - QLS: algorithms/qls.md
      - GCiM: algorithms/gcim.md
