name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the complete license in both distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = Path("LICENSE").read_bytes()
          with tarfile.open(f"dist/nwqlib-{version}.tar.gz") as source:
              assert source.extractfile(f"nwqlib-{version}/LICENSE").read() == expected
          with zipfile.ZipFile(f"dist/nwqlib-{version}-py3-none-any.whl") as wheel:
              assert wheel.read(f"nwqlib-{version}.dist-info/licenses/LICENSE") == expected
          print("Source and wheel licenses match the repository LICENSE byte for byte.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nwqlib/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
