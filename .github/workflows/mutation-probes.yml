name: Mutation Probes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-probes:
    # The baseline loads qiskit-aer with the Qiskit of the lock, see the checks job of full-ci.yml.
    runs-on: ubuntu-24.04
    # The campaign took 16 min on an Apple M3 Max, and a hosted runner can take about three times as long.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/ENVIRONMENT_LOCK.txt
      - run: python -m pip install --upgrade -c docs/ENVIRONMENT_LOCK.txt pip
      # The extras that the selected tests need. A selected test that this job cannot run fails the campaign.
      - run: python -m pip install -c docs/ENVIRONMENT_LOCK.txt --build-constraint docs/ENVIRONMENT_LOCK.txt -e ".[dev,aer,qasm,chemistry,ibm,ionq]" "$(sed -n '/^scikit_tt @ /p' docs/ENVIRONMENT_LOCK.txt)"
      # The baseline runs Aer and chemistry tests in one process, see the checks job of
      # full-ci.yml.
      - name: Preload the OpenMP library of pyscf
        run: |
          library=$(python -c 'from importlib.util import find_spec; from pathlib import Path; (path,) = Path(find_spec("pyscf").submodule_search_locations[0], "lib").glob("libgomp*.so*"); print(path)')
          echo "LD_PRELOAD=$library" >> "$GITHUB_ENV"
      - run: python -m pip check
      - run: python docs/scripts/mutation_probes.py
      - name: Report resolved environment
        if: always()
        run: python -m pip freeze
