name: Mutation Probes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/ENVIRONMENT_LOCK.txt
      - run: python -m pip install --upgrade -c docs/ENVIRONMENT_LOCK.txt pip
      - run: python -m pip install -c docs/ENVIRONMENT_LOCK.txt --build-constraint docs/ENVIRONMENT_LOCK.txt -e ".[dev,aer,qasm,chemistry]" "$(sed -n '/^scikit_tt @ /p' docs/ENVIRONMENT_LOCK.txt)"
      - run: python -m pip check
      - run: python docs/scripts/mutation_probes.py
      - name: Report resolved environment
        if: always()
        run: python -m pip freeze
